
# ~/.config/tmux-sessionizer/opencode-workspace.conf
#
# Paths to open in opencode workspace sessions.
# - Minimum 1, maximum 4 paths.
# - Each path gets its own tmux pane with opencode launched in it.
# - Uncomment and set the paths you want to work with.
#
# Pane layout is determined by the number of active paths:
#   1 path  → single full pane
#   2 paths → two panes side by side (even-horizontal)
#   3 paths → one large pane on the left, two stacked on the right (main-vertical)
#   4 paths → 2×2 tiled grid
#
# Run: opencode-workspace  (or alias: ow)

OPENCODE_WORKSPACE_PATHS=(
   /home/david/dev/agents/ai-agents
   /home/david/dev/agents/observability-stack
   /home/david/dev/agents/ai-chat-ui
)
